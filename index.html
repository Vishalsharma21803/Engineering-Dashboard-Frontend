<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Relay — your engineering workspace: Azure DevOps work, Solidtime time and SOP checks in one place. Nothing is written until you approve it."
    />
    <meta name="theme-color" content="#f8fafc" />
    <title>Relay</title>
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("relay-theme") || localStorage.getItem("cockpit-theme"); } catch (error) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        // The browser bar matches the page background (as setTheme in src/lib/theme.ts does).
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0b1120" : "#f8fafc");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
